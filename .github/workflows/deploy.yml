name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 公開用ディレクトリを別に組み立てる。チェックアウトを直接書き換えず、
      # .git や内部向け資料を含めない形で _site/ を作る。
      - name: Build publishable site into _site/
        run: |
          set -euo pipefail

          mkdir -p _site
          tar -cf - \
            --exclude='./_site' \
            --exclude='./.git' \
            --exclude='./.github' \
            --exclude='./.gitignore' \
            . | tar -xf - -C _site

          # 運営用ドキュメント（APP_INFO / SEO_REPORT / UX_REPORT / MONETIZE_REPORT / GA4週次レポート等）
          find _site -type f -name '*.md' -delete
          # 未完成・開発用ページ
          rm -rf _site/reports _site/apps/_template
          rm -rf _site/apps/mind-map/01.*

          echo "--- .md files left in _site (should be none) ---"
          find ./_site -type f -name '*.md' -print
          echo "--- excluded dirs still present? (should be none) ---"
          ls -d ./_site/reports ./_site/apps/_template ./_site/apps/mind-map/01.* 2>/dev/null || echo "  none"
          echo "--- published page count ---"
          find ./_site -name '*.html' | wc -l

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          # Pages has been sitting in deployment_queued well past the 10 min
          # default, and a timeout cancels the deployment, which then blocks
          # the next run. Allow 30 min before giving up.
          timeout: 1800000
