name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # リリース前の静的検査。NG ならここで止まり、公開されない。
      # 差し戻し内容はこのステップのログに出る。
      # ローカルでも同じものを実行できる: node .github/scripts/validate-site.js
      - name: Validate source
        run: node .github/scripts/validate-site.js

      # 計算ロジックのテスト。税・給与・年金は誤った数字が実害になるため、
      # 見た目のレビューではなく計算そのものを検証する。
      # ディレクトリ指定は Node 22 で解決に失敗するため、明示的に展開する。
      - name: Test calculations
        run: node --test .github/scripts/test/*.test.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 公開用ディレクトリを別に組み立てる。チェックアウトを直接書き換えず、
      # .git や内部向け資料を含めない形で _site/ を作る。
      - name: Build publishable site into _site/
        run: |
          set -euo pipefail

          mkdir -p _site
          tar -cf - \
            --exclude='./_site' \
            --exclude='./.git' \
            --exclude='./.github' \
            --exclude='./.gitignore' \
            . | tar -xf - -C _site

          # 運営用ドキュメント（APP_INFO / SEO_REPORT / UX_REPORT / MONETIZE_REPORT / GA4週次レポート等）
          find _site -type f -name '*.md' -delete
          # 未完成・開発用ページ
          rm -rf _site/reports _site/apps/_template
          rm -rf _site/apps/mind-map/01.*

          # まだ公開基準を満たしていないアプリ。repo には残し、公開物からだけ外す。
          # 一覧と選定理由: .github/unpublished-apps.txt
          while read -r app; do
            app="${app%%#*}"; app="$(echo "$app" | tr -d '[:space:]')"
            [ -z "$app" ] && continue
            rm -rf "_site/apps/$app"
          done < .github/unpublished-apps.txt

          echo "--- published page count ---"
          find ./_site -name '*.html' | wc -l

      # 組み立てた公開物そのものを検査する。内部資料の混入はここで
      # 必ずビルドを失敗させる（以前は echo するだけで素通りしていた）。
      - name: Validate build output
        run: node .github/scripts/validate-site.js --dir _site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          # Pages has been sitting in deployment_queued well past the 10 min
          # default, and a timeout cancels the deployment, which then blocks
          # the next run. Allow 30 min before giving up.
          timeout: 1800000

      # 「デプロイ成功」は本番が正しいことを意味しない。実際に本番へ
      # アクセスして確かめる。CDN反映を少し待ってから実行する。
      - name: Smoke test production
        run: |
          sleep 30
          node .github/scripts/smoke-test.js --base https://keisanlab.jp
