name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 内部向けの資料・未完成ページを公開対象から除外する。
      # git 上には残すため履歴とバックアップは維持される。
      - name: Strip internal docs and unfinished pages from the artifact
        run: |
          set -euo pipefail

          # 運営用ドキュメント（APP_INFO / SEO_REPORT / UX_REPORT / MONETIZE_REPORT / GA4週次レポート等）
          # -delete は -depth を暗黙に有効化し -prune と併用できないため -not -path で除外する
          find . -type f -name '*.md' -not -path './.git/*' -print -delete
          rm -rf ./reports

          # 未完成・開発用ページ
          rm -rf ./apps/_template
          rm -rf ./apps/mind-map/01.*

          echo "--- remaining .md files (should be none) ---"
          find . -type f -name '*.md' -not -path './.git/*' -print

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
